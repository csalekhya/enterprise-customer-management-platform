name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same ref cancels the previous run: no point paying for a build of code
# that has already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters let the four jobs below skip work that cannot be affected by the diff.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'deploy/terraform/**'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'

  backend:
    name: Backend · Java 21
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs Surefire (unit) and Failsafe (Testcontainers integration) - the
      # GitHub runner already has a Docker daemon, so the MySQL container starts as-is.
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · Node 22
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      # `npm ci` when a lockfile is committed, `npm install` otherwise - the same
      # branch the Dockerfile takes, so CI and the image resolve identically.
      - name: Install
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Type check and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Container images
    needs: [changes, backend, frontend]
    # Runs whenever either app changed and neither job failed; `always()` keeps it from
    # being skipped just because one of the two upstream jobs was filtered out.
    if: always() && needs.changes.outputs.docker == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, never push, on a pull request: the point is to prove the Dockerfiles
      # still build, not to publish an image nobody will deploy.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          tags: crm-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          tags: crm-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  terraform:
    name: Terraform · fmt and validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Format check
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      # No backend initialisation: validate only needs the providers, and CI holds no
      # credentials for the real state bucket.
      - name: Initialise without a backend
        run: terraform -chdir=deploy/terraform init -backend=false

      - name: Validate
        run: terraform -chdir=deploy/terraform validate
