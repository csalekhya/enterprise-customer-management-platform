# Profile activated inside the container image (SPRING_PROFILES_ACTIVE=docker).
# Everything here is either a compose/ECS specific default or a production hardening.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:crm}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}

  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 100
    connection-timeout: 20s

management:
  endpoint:
    health:
      show-details: never       # the ALB only needs UP/DOWN, not the component breakdown

logging:
  level:
    root: INFO
    io.crmplatform: INFO
    org.hibernate.SQL: WARN
