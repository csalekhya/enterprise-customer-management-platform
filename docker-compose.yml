# Local stack: MySQL, the Spring Boot API and the nginx-served SPA.
#
# The API waits for MySQL's health check rather than just its container start, because
# Flyway runs during boot and a half-initialised database produces a confusing failure.

name: enterprise-crm

services:
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-crm}
      MYSQL_USER: ${DB_USERNAME:-crm_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-crm_app_password}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-root_password}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - crm

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-crm}
      DB_USERNAME: ${DB_USERNAME:-crm_app}
      DB_PASSWORD: ${DB_PASSWORD:-crm_app_password}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-characters}
      JWT_ISSUER: ${JWT_ISSUER:-slate-crm}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/actuator/health/readiness']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_UPSTREAM: api:8080
    ports:
      - '${WEB_PORT:-3000}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - crm

volumes:
  mysql-data:
    driver: local

networks:
  crm:
    driver: bridge
