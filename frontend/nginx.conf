# nginx server block for the React SPA.
#
# Three jobs: serve hashed assets with a long cache, never cache index.html, and proxy
# /api to the Spring Boot service so the browser only ever talks to one origin.

upstream crm_api {
    # Resolved from the compose service name, or from the ECS service discovery name.
    server ${API_UPSTREAM};
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- compression ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/problem+json
        application/xml
        image/svg+xml
        font/woff2;

    # --- security headers -----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
    client_max_body_size 2m;

    # --- container health -----------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API reverse proxy ----------------------------------------------------------
    # Same-origin API: no CORS preflight in production, and the browser sends the bearer
    # token to a host it already trusts.
    location /api/ {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Actuator is proxied but deliberately limited to the health endpoints.
    location /actuator/health {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # --- static assets --------------------------------------------------------------
    # Vite fingerprints every file under /assets, so the content at a given URL can never
    # change: immutable for a year, and a deploy simply publishes new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # --- SPA history fallback -------------------------------------------------------
    # index.html must never be cached: it is the document that points at the current
    # asset hashes, so a stale copy would load a deleted bundle after a deploy.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header Content-Type text/plain;
        return 503 "The application is temporarily unavailable.\n";
    }
}
